[pytest]
log_cli = true
log_cli_level = INFO
log_file_level = DEBUG
log_format = %(asctime)s %(levelname)s (%(name)s): %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

markers =
    # test suits
    stability: stability test suit
    
    # ammeters marks
    greenlee: mark test to run with greenlee ammeter
    entes: mark test to run with entes ammeter
    circutor: mark test to run with circutor ammeter